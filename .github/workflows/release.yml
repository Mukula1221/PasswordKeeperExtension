name: Release

# 推上 v1.2.3 這種標籤時：確認標籤跟 manifest.json 的版本一樣、打包，建立 GitHub Release 並附上 zip
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: 打包並建立 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 用目前最新的 LTS（2026 年 11 月是 26），check-latest 讓每次都拿最新的修補版，資安修補出來就會用上
          node-version: lts/*
          check-latest: true
      - name: 檢查，標籤要跟版本號一樣
        run: node tools/check.js --tag "$GITHUB_REF_NAME"
      - name: 打包
        run: node tools/build.js
      - name: 產生這一版的說明
        run: node tools/release-notes.js "$GITHUB_REF_NAME" > release-notes.md
      - name: 建立 Release 並附上打包檔
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --title "密碼小管家 ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
