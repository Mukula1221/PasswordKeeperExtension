name: CI

# 每次推上分支或開 PR：檢查版本號和版本紀錄、打包，打包檔放在這次執行的 Artifacts 可以下載
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: 檢查和打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 用目前最新的 LTS（2026 年 11 月是 26），check-latest 讓每次都拿最新的修補版，資安修補出來就會用上
          node-version: lts/*
          check-latest: true
      - name: 檢查
        run: node tools/check.js
      - name: 打包
        run: node tools/build.js
      # 打包檔放在這次執行頁面最下面的 Artifacts，名稱就是 zip 的檔名。
      # archive: false 直接上傳 zip 本身，下載下來就是能解壓縮載入的那個檔，不會再多包一層。只是測試用，正式版請用 Releases。
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
