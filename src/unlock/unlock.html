<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title data-i18n="unl_title">解鎖密碼小管家</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    html, body { height: 100%; }
    body { width: 100%; display: flex; flex-direction: column; }
    .body { flex: 1; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
    .state { display: flex; align-items: flex-start; gap: 12px; }
    .state .title { font-size: 15px; font-weight: 600; line-height: 22px; }
    .state .sub { margin-top: 2px; font-size: 13px; color: var(--muted); }
    .mark { flex: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mark.spin { border: 3px solid #dbeafe; border-top-color: var(--primary); animation: spin 0.9s linear infinite; }
    .mark.ok { background: #16a34a; }
    .mark.bad { background: var(--danger); }
    @keyframes spin { to { transform: rotate(360deg); } }
    #retry { padding: 0; font-size: inherit; text-decoration: underline; }
    #retry:hover { background: transparent; }
    .actions { margin-top: auto; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../../icons/icon32.png" alt="">
    <div class="grow"><h1 data-i18n="unl_title">解鎖密碼小管家</h1></div>
  </div>
  <div class="body">
    <div aria-live="polite">
      <div id="waiting" class="state">
        <div class="mark spin" aria-hidden="true"></div>
        <div>
          <div id="waitTitle" class="title"></div>
          <div class="sub"><span data-i18n="unl_not_shown">沒有自動跳出來？</span><button id="retry" class="link" data-i18n="unl_retry">點這裡重新開啟</button></div>
        </div>
      </div>
      <div id="failed" class="state" hidden>
        <div class="mark bad" aria-hidden="true">!</div>
        <div id="failMsg" class="title"></div>
      </div>
      <div id="done" class="state" hidden>
        <div class="mark ok" aria-hidden="true"><svg viewBox="0 0 16 16" width="13" height="13"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="title" data-i18n="unl_done">已解鎖</div>
      </div>
    </div>
    <div class="row end actions">
      <button id="close" data-i18n="unl_cancel">取消</button>
      <button id="hello" class="primary" hidden data-i18n="unl_try_again">再試一次</button>
    </div>
  </div>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/webauthn-client.js"></script>
  <script src="unlock.js"></script>
</body>
</html>
